[[headers]]
  for = "/*"
  [headers.values]
    # We don't use iframes. Block them.
    X-Frame-Options = "DENY"
    # Don't allow Mime-sniffing.
    X-Content-Type-Options = "nosniff"
    # Add reflective XSS protection.
    X-XSS-Protection = "1; mode=block"
    # X-Permitted-Cross-Domain-Policies
    X-Permitted-Cross-Domain-Policies = "none"
    # Force HTTPS only.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Load scripts only via HTTPS and from allowed domains.
Content-Security-Policy = "default-src *; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' www.evvolabs.com"
    # Only send referred when HTTPS is used.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable certain magic features, lol.
    Feature-Policy = "vibrate none; usermedia *; sync-xhr self"
    # Expect CT 
    Expect-CT = "enforce; max-age=43200; report-uri='https://www.evvolabs.com/report'"
